name: nightly-update
on:
  schedule: [{ cron: '17 1 * * *' }]
  workflow_dispatch:
permissions: { contents: write, actions: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node scripts/fetch-stats.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: node scripts/fetch-breaking.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Weekly pricing page snapshot (Mondays, or manual run)
        run: '[ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && node scripts/pricing-snapshot.mjs || true'
      - name: Commit data changes
        run: |
          git config user.name "agentstackwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then git commit -m "data: nightly update $(date -u +%F)" && git push; fi
      - name: Redeploy site
        run: gh workflow run deploy.yml --ref main
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
